packages:
  - 'apps/*'
  - 'packages/*'
# Added by pnpm because these versions are newer than a `minimumReleaseAge`
# policy configured locally. They are deliberate — the repo tracks current
# tooling — so the exclusions are committed rather than re-prompted per machine.
minimumReleaseAgeExclude:
  - '@size-limit/file@14.2.0'
  - '@size-limit/preset-big-lib@14.2.0'
  - '@size-limit/time@14.2.0'
  - '@size-limit/webpack@14.2.0'
  - size-limit@14.2.0
  - vite@8.3.4
