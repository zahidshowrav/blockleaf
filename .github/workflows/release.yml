name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write # npm provenance

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            # v2, not v1. v1 decides whether anything was published by
            # grepping the publish script's stdout for `New tag:`, which
            # `@changesets/cli` stopped printing in v3 — it now prints
            # `Created git tags:`. The publish still succeeded, so the package
            # reached npm, but the action saw no releases and therefore pushed
            # no tag and created no GitHub release. That is why 0.0.4 is on
            # npm with nothing on GitHub.
            - name: Create release PR or publish
              uses: changesets/action@v2
              with:
                  version-script: pnpm version-packages
                  publish-script: pnpm release
                  commit-message: 'chore: version packages'
                  pr-title: 'chore: version packages'
                  create-github-releases: true
              env:
                  # No GITHUB_TOKEN here: v2 reads the `github-token` input,
                  # which defaults to the workflow token, and errors if the
                  # environment variable is set to something different.
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
