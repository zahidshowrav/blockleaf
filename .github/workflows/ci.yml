name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

            - name: Package versions in the docs
              run: pnpm check:versions

            - name: Unit tests
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Packaging (publint + are-the-types-wrong)
              run: pnpm check:packaging

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: E2E tests
              run: pnpm test:e2e

            - name: Bundle size
              run: pnpm size

    changeset:
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: A changeset is required for package changes
              run: pnpm changeset status --since=origin/main
